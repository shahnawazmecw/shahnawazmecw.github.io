name: Update publications from Scopus

# Every Monday: add papers that are new on the Scopus author profile to
# js/data.js, rebuild resume.pdf from cv.html, and publish.
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scopus-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add new Scopus papers
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
        run: python tools/update_from_scopus.py --apply

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- js/data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the CV PDF
        if: steps.diff.outputs.changed == 'true'
        run: python tools/build_cv.py

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js resume.pdf
          git commit -m "Add new papers from Scopus and rebuild the CV"
          git push

      - name: Publish the site
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
